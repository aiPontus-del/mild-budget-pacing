# Exempel för nginx. Byt pacing.example.se mot den valda domänen.
# Certifikat t.ex. via certbot: certbot --nginx -d pacing.example.se

server {
    listen 80;
    server_name pacing.example.se;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pacing.example.se;

    ssl_certificate     /etc/letsencrypt/live/pacing.example.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pacing.example.se/privkey.pem;

    # Valfritt: begränsa till kontorets IP eller VPN
    # allow 203.0.113.0/24;
    # deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Första hämtningen mot ~300 konton kan ta en stund
        proxy_read_timeout 180s;
    }
}
